plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.17'
}

group = 'com.allowance'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.235'
}

repositories {
    maven {
        url = uri('file:///' + projectDir.toString().replace('\\', '/') + '/local-repo')
    }
    maven {
        url = uri('https://maven.aliyun.com/repository/public')
    }
    maven {
        url = uri('https://bmclapi2.bangbang93.com/maven/')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
